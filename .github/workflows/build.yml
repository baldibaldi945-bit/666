name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q AudioMerger.zip

      - name: Install SDK packages
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          sudo chown -R $USER $ANDROID_HOME
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platform-tools" "platforms;android-28" "build-tools;28.0.3" "cmake;3.10.2.4988404" "ndk;20.0.5594570"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '4.6'

      - name: Fetch native deps
        working-directory: AudioMerger
        run: |
          sh scripts/fetch-native-deps.sh
          sh scripts/fetch-codecs.sh

      - name: Build debug APK
        working-directory: AudioMerger
        run: gradle -p android --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AudioMerger-debug-apk
          path: AudioMerger/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
