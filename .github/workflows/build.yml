name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q AudioMerger.zip

      - name: Install SDK packages
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          sudo chown -R $USER $ANDROID_HOME
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          cat > pkgs.txt <<EOF
          platform-tools
          platforms;android-28
          build-tools;28.0.3
          cmake;3.10.2.4988404
          ndk;20.0.5594570
          EOF
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --package_file=pkgs.txt

      - name: Remove newer SDK packages
        run: |
          cd $ANDROID_HOME
          find platforms -mindepth 1 -maxdepth 1 ! -name android-28 -exec rm -rf {} +
      - name: Write local.properties
        working-directory: AudioMerger/android
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/20.0.5594570
          EOF

      - name: Build debug APK
        working-directory: AudioMerger
        run: |
          gradle -p android --no-daemon --stacktrace assembleDebug > build.log 2>&1 || {
            echo === CAUSED BY ===
            grep -n Caused build.log | head -20
            echo === ERRORS ===
            grep -n -i -e error -e exception -e failed build.log | head -30
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AudioMerger-debug-apk
          path: AudioMerger/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
